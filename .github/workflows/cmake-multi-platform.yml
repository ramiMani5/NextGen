name: CMake Windows Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release]

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Debug: list repo contents
      - name: List workspace contents
        run: dir "${{ github.workspace }}"

      - name: List Software folder
        run: dir "${{ github.workspace }}/Software"

      # 3️⃣ Configure CMake
      - name: Configure CMake
        run: cmake -S "${{ github.workspace }}/Software" -B "${{ github.workspace }}/build" -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      # 4️⃣ Build project
      - name: Build
        run: cmake --build "${{ github.workspace }}/build" --config ${{ matrix.build_type }}

      # 5️⃣ Run tests
      - name: Test
        working-directory: "${{ github.workspace }}/build"
        run: ctest --build-config ${{ matrix.build_type }}
